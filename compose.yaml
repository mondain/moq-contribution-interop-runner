services:
  validator:
    image: moq-contribution-interop-runner:local
    build:
      context: .
      args:
        SOURCE_REVISION: ${MOQ_INTEROP_SOURCE_REVISION:?set MOQ_INTEROP_SOURCE_REVISION to the exact source revision}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MOQ_INTEROP_HTTP_BIND:-127.0.0.1}:${MOQ_INTEROP_HTTP_PORT:-8080}:8080/tcp"
      # Reserved for the later publisher listener; the foundation service does not bind UDP.
      - "${MOQ_INTEROP_UDP_BIND:-127.0.0.1}:${MOQ_INTEROP_UDP_START:-4443}-${MOQ_INTEROP_UDP_END:-4452}:${MOQ_INTEROP_UDP_START:-4443}-${MOQ_INTEROP_UDP_END:-4452}/udp"
    volumes:
      - validator-results:/var/lib/moq-interop
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "1", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    restart: unless-stopped

volumes:
  validator-results:
