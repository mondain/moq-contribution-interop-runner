name: Draft release audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # moqxr 4b615f4 ("Add moqt draft 22") is the revision the first draft 22 sweep ran
      # against (2026-10-06). It replaced 0993cf7, against which the draft 18 and 21 moqxr
      # stages were first verified. 4b615f4 still publishes drafts 18 and 21; their
      # repeatability stages passed against a local 4b615f4 build, but not yet in this workflow.
      - uses: actions/checkout@v5
        with:
          repository: openmoq/moqxr
          ref: 4b615f4874d67653035642c80a3d454db759859e
          path: external/moqxr
      - name: Install build and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang g++ libsqlite3-dev libssl-dev perl pkg-config jq openssl curl ripgrep
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Build pinned external publisher
        run: |
          cmake -S external/moqxr -B external/moqxr/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENMOQ_BUILD_TESTS=OFF \
            -DOPENMOQ_RUN_PICOQUIC_SMOKE_TESTS=OFF
          cmake --build external/moqxr/build --parallel 2 \
            --target openmoq-publisher
      - name: Build source-matched Docker validator
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            -t "moq-interop-runner:$GITHUB_SHA" .
      - name: Run release gate and retain incomplete evidence
        id: release
        run: |
          set +e
          bash tests/e2e/release-audit.sh run "$RUNNER_TEMP/release-audit" \
            "$PWD/build/moq-interop-audit" \
            "moq-interop-runner:$GITHUB_SHA" \
            "$PWD/build/moq-interop-picoquic-peer" \
            "$PWD/external/moqxr/build/openmoq-publisher" \
            "$PWD/external/moqxr/tests/fixtures/locmaf-publisher.mp4"
          result=$?
          set -e
          printf 'exit_code=%s\n' "$result" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Upload release audit evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: draft-release-audit
          path: ${{ runner.temp }}/release-audit/
          if-no-files-found: warn
      - name: Enforce release gate
        if: always()
        run: test "${{ steps.release.outputs.exit_code }}" = 0
